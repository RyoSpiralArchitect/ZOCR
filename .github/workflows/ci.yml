name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
      - name: Lint
        run: |
          python -m ruff check .
      - name: Test
        run: |
          python -m pytest -q
      - name: Build
        run: |
          python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t zocr-suite:ci --build-arg ZOCR_EXTRAS="api" .
      - name: Smoke test
        run: |
          docker run --rm zocr-suite:ci zocr --version
          docker run --rm zocr-suite:ci zocr validate --help

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: zocr_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: zocr_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U zocr_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      s3:
        image: motoserver/moto:5.0.28
        ports:
          - 5000/tcp
    env:
      ZOCR_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
      ZOCR_TEST_POSTGRES_URL: postgresql://zocr_test:local_test_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/zocr_test
      ZOCR_TEST_S3_URL: http://127.0.0.1:${{ job.services.s3.ports[5000] }}
      ZOCR_TEST_BROWSER: "1"
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: |
          python -m pip install uv==0.7.19
          uv pip install --system --exclude-newer "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" -e ".[dev,api_saas,multimodal,parquet,pdf,ocr_tess]" playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real services, PDF extraction and review browser
        run: python -m pytest -q -rs
